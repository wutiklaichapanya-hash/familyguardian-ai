# FamilyGuardian AI (FGAI-2026-001) — continuous integration.
#
# NO DEPLOY JOB, ON PURPOSE.
# Deploys require the RELEASE gate in config/gates.yaml (human roles: pm + devops,
# evidence: release note, rollback + restore rehearsal, help-directory verification)
# and are NOT automated. Do not add a deploy, publish or push-image job here without a
# signed RELEASE gate recorded in docs/decisions/DECISIONS_LOG.md.
#
# Everything here runs on synthetic data only. No secrets are needed or used: the
# only credentials are the documented local-only values from .env.example.
#
# Third-party actions are pinned to major tags for readability. Pin them to full
# commit SHAs before this repository is made public or connected to a real remote.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  # Local-only values, identical to .env.example. Not secrets.
  DATABASE_URL: postgres://fg:fg_local_only@localhost:5432/familyguardian
  SESSION_SECRET: ci-only-session-secret-32-chars-minimum
  AI_EXPLAINER_ENABLED: "false"
  PAYMENTS_MODE: sandbox

jobs:
  install:
    name: install (pnpm, cached)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    name: unit tests (vitest + postgres:17)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fg
          POSTGRES_PASSWORD: fg_local_only
          POSTGRES_DB: familyguardian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fg -d familyguardian"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      # Package scripts load ../../.env via --env-file; build it from the template and
      # point it at the CI service container (port 5432, not the local 5433).
      - name: Create .env from template
        run: |
          cp .env.example .env
          sed -i 's#^DATABASE_URL=.*#DATABASE_URL='"$DATABASE_URL"'#' .env
          sed -i 's#^SESSION_SECRET=.*#SESSION_SECRET='"$SESSION_SECRET"'#' .env
      - run: pnpm db:migrate
      - run: pnpm test

  e2e:
    name: e2e (playwright, chromium, seeded DB)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fg
          POSTGRES_PASSWORD: fg_local_only
          POSTGRES_DB: familyguardian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fg -d familyguardian"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - name: Create .env from template
        run: |
          cp .env.example .env
          sed -i 's#^DATABASE_URL=.*#DATABASE_URL='"$DATABASE_URL"'#' .env
          sed -i 's#^SESSION_SECRET=.*#SESSION_SECRET='"$SESSION_SECRET"'#' .env
      - name: Migrate and seed (synthetic demo accounts)
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build web
        run: pnpm --filter @fg/web build
      # tests/e2e/playwright.config.ts also declares webServer entries with
      # reuseExistingServer: true, so it reuses the production-mode servers started here.
      - name: Start API and web in the background
        env:
          # The API's global limit (300/min/IP) is for people; the serial E2E suite on one CI IP needs more.
          # Login limits stay at their defaults (the suite re-uses sessions).
          RATE_LIMIT_GLOBAL_MAX: "5000"
        run: |
          nohup pnpm --filter @fg/api start > api.log 2>&1 &
          nohup pnpm --filter @fg/web start > web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4100/api/health >/dev/null 2>&1 \
              && curl -fsS -o /dev/null http://localhost:3100/ && exit 0
            sleep 2
          done
          echo "servers did not become ready"; tail -50 api.log web.log; exit 1
      - run: pnpm test:e2e --project=chromium
      - name: Upload Playwright report and server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            api.log
            web.log
          retention-days: 7

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Runs the OSS binary in a container, so no gitleaks licence key is needed.
      - name: gitleaks (git history + working tree)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git --config /repo/.gitleaks.toml --redact --verbose --exit-code 1 /repo
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.28.0 \
            dir --config /repo/.gitleaks.toml --redact --verbose --exit-code 1 /repo

  audit:
    name: dependency audit (high+)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - run: pnpm audit --audit-level high

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # `semgrep scan` with registry rulesets; no Semgrep App token is used.
      - run: semgrep scan --config p/typescript --config p/owasp-top-ten --error --metrics off --exclude node_modules --exclude docs
