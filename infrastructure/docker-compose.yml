name: familyguardian
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fg
      POSTGRES_PASSWORD: fg_local_only
      POSTGRES_DB: familyguardian
    ports: ["5433:5432"]
    volumes: [fgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fg -d familyguardian"]
      interval: 3s
      retries: 20
volumes:
  fgdata:
